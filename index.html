<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<script>/* arcAId theme: light by default, remembered per browser */try{var _t=localStorage.getItem("gmh:theme");document.documentElement.setAttribute("data-arcade-theme",_t==="dark"?"dark":"light");}catch(e){document.documentElement.setAttribute("data-arcade-theme","light");}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>arcAId · משחקים קטנים, שיאים גדולים</title>
<meta name="description" content="אוסף משחקי דפדפן קטנים שנבנו בכיף והנאה לצרכי לימוד ובידור בעזרת בינה מלאכותית — כל משחק עם טבלת שיאים כללית.">
<meta property="og:title" content="arcAId · משחקים קטנים, שיאים גדולים">
<meta property="og:description" content="אוסף משחקי דפדפן קטנים שנבנו בכיף והנאה לצרכי לימוד ובידור בעזרת בינה מלאכותית — כל משחק עם טבלת שיאים כללית.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%95%B9%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d1c; --bg2:#12142a;
  --card:rgba(255,255,255,.045); --card-h:rgba(255,255,255,.075);
  --line:rgba(255,255,255,.09);
  --tx:#eef1ff; --tx2:#9aa3c9; --tx3:#6f779e;
  --a:#7c9dff; --b:#b06bff;
  --r:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  background:var(--bg); color:var(--tx); min-height:100dvh;
  direction:rtl; text-align:right; line-height:1.55;
  overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(1000px 620px at 88% -12%, rgba(124,157,255,.20), transparent 62%),
    radial-gradient(820px 560px at 6% 4%, rgba(176,107,255,.16), transparent 60%),
    radial-gradient(700px 500px at 50% 112%, rgba(255,138,76,.10), transparent 62%),
    linear-gradient(180deg,#0b0d1c,#111327 70%,#0b0d1c);
}
.shell{width:min(1080px,100%);margin:0 auto;padding:clamp(28px,6vw,64px) clamp(16px,4vw,32px) 72px}

/* ---------- header ---------- */
header{margin-bottom:clamp(28px,5vw,48px)}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12.5px;font-weight:600;letter-spacing:.04em;color:var(--tx2);
  background:var(--card);border:1px solid var(--line);
  padding:6px 13px;border-radius:100px;margin-bottom:18px
}
.eyebrow i{width:6px;height:6px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.18);font-style:normal}
h1{
  direction:ltr;
  font-size:clamp(38px,8vw,66px);font-weight:800;letter-spacing:-.025em;line-height:1.05;
  background:linear-gradient(120deg,#fff 20%,#b9c6ff 55%,#d7b4ff 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  margin-bottom:14px
}
/* the AI in arcAId is a warm accent, clearly a different colour from the rest of the word */
.ai{background:linear-gradient(120deg,#ffc23d,#ff7a45);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:clamp(16px,3vw,21px);font-weight:500;color:#b9c1e6;margin:-6px 0 14px}
.lede{font-size:clamp(15px,2.4vw,17.5px);color:var(--tx2);max-width:56ch}
.lede b{color:var(--tx);font-weight:500}

/* ---------- grid ---------- */
.sec-title{
  display:flex;align-items:baseline;gap:12px;margin:0 0 18px;
  font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--tx3);text-transform:uppercase
}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}

.card{
  position:relative;overflow:hidden;border-radius:var(--r);
  background:var(--card);border:1px solid var(--line);
  padding:22px 20px 18px;
  transition:transform .22s cubic-bezier(.2,.9,.3,1.1),background .22s,border-color .22s;
}
.card::before{
  content:"";position:absolute;inset:0 0 auto;height:3px;
  background:linear-gradient(90deg,var(--ca,var(--a)),var(--cb,var(--b)));
  opacity:.9
}
.card::after{
  content:"";position:absolute;top:-70px;left:-70px;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,var(--ca,var(--a)),transparent 68%);opacity:.16;
  transition:opacity .25s;pointer-events:none
}
.card:hover{transform:translateY(-3px);background:var(--card-h);border-color:rgba(255,255,255,.16)}
.card:hover::after{opacity:.3}

.card-head{display:flex;align-items:flex-start;gap:13px;margin-bottom:14px}
.ic{
  flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px;
  background:linear-gradient(140deg,var(--ca,var(--a)),var(--cb,var(--b)));
  box-shadow:0 8px 22px -8px var(--ca,var(--a))
}
.card h3{font-size:19px;font-weight:700;letter-spacing:-.01em;margin-bottom:3px}
.card p{font-size:13.5px;color:var(--tx2);line-height:1.5}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.tag{font-size:11px;font-weight:500;color:var(--tx2);background:rgba(255,255,255,.06);border-radius:7px;padding:3px 8px}

/* mini leaderboard inside a card */
.mini{border-top:1px solid var(--line);margin-top:16px;padding-top:13px;min-height:76px}
.mini-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.mini-h span{font-size:11.5px;font-weight:600;letter-spacing:.05em;color:var(--tx3)}
.mini-h button{
  border:0;background:none;cursor:pointer;font:inherit;font-size:12px;font-weight:600;
  color:var(--ca,var(--a));padding:2px 4px;border-radius:6px;transition:.15s
}
.mini-h button:hover{background:rgba(255,255,255,.07)}
.row{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13.5px}
.row .rk{
  flex:none;width:21px;height:21px;border-radius:7px;display:grid;place-items:center;
  font-size:11px;font-weight:700;background:rgba(255,255,255,.07);color:var(--tx2)
}
.row:nth-child(1) .rk{background:linear-gradient(135deg,#ffd561,#f0a020);color:#3a2400}
.row:nth-child(2) .rk{background:linear-gradient(135deg,#e2e8f6,#a8b2cc);color:#2c3140}
.row:nth-child(3) .rk{background:linear-gradient(135deg,#e2a06a,#b9713c);color:#2e1a08}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.row .vl{flex:none;width:21px;text-align:center;font-size:13px;line-height:1}
.row .nm.dim{color:var(--tx3);font-weight:400}
.row .sc{flex:none;font-weight:700;font-variant-numeric:tabular-nums;color:#c8d2ff}
.empty{font-size:13px;color:var(--tx3);padding:8px 0}
.sk{height:13px;border-radius:6px;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.11),rgba(255,255,255,.05));background-size:200% 100%;animation:sh 1.4s infinite;margin:9px 0}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

.play{
  display:flex;align-items:center;justify-content:center;gap:7px;
  margin-top:16px;height:46px;border-radius:14px;text-decoration:none;
  font-size:15px;font-weight:600;color:#fff;
  background:linear-gradient(135deg,var(--ca,var(--a)),var(--cb,var(--b)));
  box-shadow:0 10px 24px -12px var(--ca,var(--a));transition:.16s
}
.play:hover{filter:brightness(1.1);transform:translateY(-1px)}

/* soon card */
.soon{
  border:1px dashed rgba(255,255,255,.14);background:transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:8px;min-height:230px;color:var(--tx3)
}
.soon::before,.soon::after{display:none}
.soon:hover{transform:none;background:rgba(255,255,255,.02)}
.soon .big{font-size:32px;opacity:.5}
.soon b{font-size:15px;font-weight:600;color:var(--tx2)}
.soon small{font-size:12.5px;max-width:24ch;line-height:1.5}

footer{margin-top:56px;padding-top:22px;border-top:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;
  font-size:13px;color:var(--tx3)}
footer a{color:var(--tx2);text-decoration:none;border-bottom:1px solid transparent;transition:.15s}
footer a:hover{color:var(--tx);border-bottom-color:var(--line)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== arcaide-theme: light mode ===== */
html[data-arcade-theme="light"] {
  --bg:#eef2fb; --bg2:#e2e9f7;
  --card:rgba(255,255,255,.80); --card-h:rgba(255,255,255,.95);
  --line:rgba(31,43,61,.12);
  --tx:#1b2540; --tx2:#4d5b7d; --tx3:#7b87a6;
}
html[data-arcade-theme="light"] body::before{
  background:
    radial-gradient(1000px 620px at 88% -12%, rgba(124,157,255,.22), transparent 62%),
    radial-gradient(820px 560px at 6% 4%, rgba(176,107,255,.16), transparent 60%),
    radial-gradient(700px 500px at 50% 112%, rgba(255,138,76,.12), transparent 62%),
    linear-gradient(180deg,#eef2fb,#e6ecf9 70%,#eef2fb);
}
html[data-arcade-theme="light"] h1{
  background:linear-gradient(120deg,#1b2540 15%,#4b62c8 55%,#8a4fd0 92%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
html[data-arcade-theme="light"] .ai{background:linear-gradient(120deg,#ef8a17,#e2553d);-webkit-background-clip:text;background-clip:text;color:transparent}
html[data-arcade-theme="light"] .sub{color:#3d4a6b}
html[data-arcade-theme="light"] .tag{background:rgba(31,43,61,.07)}
html[data-arcade-theme="light"] .row .rk{background:rgba(31,43,61,.08);color:var(--tx2)}
html[data-arcade-theme="light"] .row .sc{color:#3a4a7a}
html[data-arcade-theme="light"] .card{box-shadow:0 6px 20px -12px rgba(31,43,61,.35)}
html[data-arcade-theme="light"] .sk{background:linear-gradient(90deg,rgba(31,43,61,.05),rgba(31,43,61,.11),rgba(31,43,61,.05));background-size:200% 100%}
html[data-arcade-theme="light"] .soon{border-color:rgba(31,43,61,.18)}
/* ===== arcaide-mobile-grid: two games per row, so several are visible at once ===== */
@media (max-width: 760px){
  .shell{padding:18px 12px 40px}
  header{margin-bottom:16px}
  .eyebrow{display:none}
  h1{font-size:clamp(30px,10vw,40px);margin-bottom:4px}
  .sub{font-size:15px;margin:0 0 6px}
  .lede{font-size:13px;max-width:none}
  .sec-title{margin-bottom:12px;font-size:11.5px}

  /* minmax(0,...) + min-width:0 so a long name can't widen the whole track */
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .grid > *{min-width:0}
  .card{padding:13px 11px 11px;border-radius:17px;min-width:0}
  .mini-h span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mini-h button{flex:none}
  .card::after{width:130px;height:130px;top:-45px;left:-45px}
  .card-head{gap:9px;margin-bottom:9px}
  .ic{width:38px;height:38px;border-radius:12px;font-size:19px}
  .card h3{font-size:14.5px;margin-bottom:2px}
  .card p{font-size:11px;line-height:1.4;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tags{display:none}

  .mini{margin-top:9px;padding-top:8px;min-height:0}
  .mini-h{margin-bottom:5px}
  .mini-h span{font-size:10px}
  .mini-h button{font-size:10.5px;padding:1px 3px}
  .row{font-size:11.5px;gap:6px;padding:2.5px 0}
  .row .rk{width:17px;height:17px;border-radius:5px;font-size:9.5px}
  .row .vl{font-size:12px}
  .empty{font-size:11px;padding:5px 0;line-height:1.4}

  .play{height:38px;font-size:13px;margin-top:9px;border-radius:11px}
  .soon{min-height:0;padding:18px 10px;gap:5px}
  .soon .big{font-size:24px}
  .soon b{font-size:13px}
  .soon small{font-size:11px}
  footer{margin-top:32px;font-size:12px}
}
@media (max-width: 430px){
  .mini-h span{display:none}          /* the medal / difficulty dot already says it */
  .mini-h{justify-content:flex-start}
}
@media (max-width: 360px){
  .card p{-webkit-line-clamp:2;font-size:10.5px}
  .card h3{font-size:13.5px}
}
</style>
<!-- arcaide-pwa: installable to the home screen -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="theme-color" content="#0b0d1c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="arcAId">
</head>
<body>
<div class="shell">

  <header>
    <h1>arc<span class="ai">AI</span>d</h1>
    <p class="sub">משחקים קטנים, שיאים גדולים</p>
    <p class="lede">אוסף משחקי דפדפן קטנים שנבנו בכיף והנאה לצרכי לימוד ובידור בעזרת בינה מלאכותית. <b>כל משחק שומר טבלת שיאים כללית</b> — שוברים שיא, כותבים שם, ונשארים על הלוח.</p>
  </header>

  <h2 class="sec-title">המשחקים</h2>
  <div class="grid" id="grid"></div>

  <footer>
    <span>קוד פתוח ב־<a href="https://github.com/gilmagnum/games">GitHub</a></span>
    <span id="stat"></span>
  </footer>

</div>

<script src="./config.js"></script>
<script src="./leaderboard.js"></script>
<script>
(function(){
  var grid = document.getElementById('grid');
  var CFG  = window.GAMES_LB_CONFIG || {};
  var games = [];

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

  function num(n){return Number(n).toLocaleString('he-IL');}

  function card(g){
    var el = document.createElement('article');
    el.className = 'card';
    el.style.setProperty('--ca', g.accent  || '#7c9dff');
    el.style.setProperty('--cb', g.accent2 || g.accent || '#b06bff');
    el.innerHTML =
      '<div class="card-head">' +
        '<div class="ic">' + esc(g.emoji || '🎮') + '</div>' +
        '<div><h3>' + esc(g.title) + '</h3><p>' + esc(g.subtitle || '') + '</p>' +
        (g.tags && g.tags.length
          ? '<div class="tags">' + g.tags.map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('') + '</div>'
          : '') +
        '</div>' +
      '</div>' +
      '<div class="mini" data-slug="' + esc(g.slug) + '">' +
        '<div class="mini-h"><span>מובילים</span><button type="button">טבלה מלאה ←</button></div>' +
        '<div class="body"><div class="sk" style="width:80%"></div><div class="sk" style="width:65%"></div><div class="sk" style="width:72%"></div></div>' +
      '</div>' +
      '<a class="play" href="' + esc(g.url) + '">שחק עכשיו ←</a>';

    el.querySelector('.mini-h button').addEventListener('click', function(){
      if (!window.Leaderboard) return;
      Leaderboard.init({
        game: g.slug, title: g.title,
        scoreLabel: g.scoreLabel || 'נקודות',
        scoreOrder: g.scoreOrder || 'desc',
        variants: g.variants || null,
        hubUrl: location.href.split('#')[0]
      });
      Leaderboard.show();
    });
    return el;
  }

  function soonCard(){
    var el = document.createElement('article');
    el.className = 'card soon';
    el.innerHTML = '<div class="big">✦</div><b>עוד משחק בדרך</b>' +
      '<small>כל משחק חדש שנבנה מתווסף לכאן אוטומטית — עם טבלת שיאים משלו.</small>';
    return el;
  }

  function renderScores(map){
    document.querySelectorAll('.mini').forEach(function(m){
      var slug = m.dataset.slug;
      var g = games.filter(function(x){ return x.slug === slug; })[0] || {};
      var body = m.querySelector('.body');

      // A game split into difficulties shows the leader of each, not one board's top 3.
      if (g.variants && g.variants.length){
        m.querySelector('.mini-h span').textContent = 'מוביל בכל רמה';
        body.innerHTML = g.variants.map(function(v){
          var top = (map[v.slug] || [])[0];
          return '<div class="row"><span class="vl">' + esc(v.label.split(' ')[0]) + '</span>' +
                 (top
                   ? '<span class="nm">' + esc(top.player) + '</span><span class="sc">' + num(top.score) + '</span>'
                   : '<span class="nm dim">עוד אין</span><span class="sc">—</span>') +
                 '</div>';
        }).join('');
        return;
      }

      var rows = map[slug] || [];
      if(!rows.length){ body.innerHTML = '<div class="empty">אין עדיין שיאים — הלוח פתוח 🚀</div>'; return; }
      body.innerHTML = rows.slice(0,3).map(function(r){
        return '<div class="row"><span class="rk">'+r.rank+'</span>' +
               '<span class="nm">'+esc(r.player)+'</span>' +
               '<span class="sc">'+num(r.score)+'</span></div>';
      }).join('');
    });
  }

  function loadScores(){
    if(!CFG.supabaseUrl || CFG.supabaseUrl.indexOf('REPLACE_ME')>-1){
      renderScores({}); document.getElementById('stat').textContent=''; return;
    }
    fetch(CFG.supabaseUrl.replace(/\/+$/,'')+'/rest/v1/rpc/hub_leaderboards',{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':CFG.supabaseKey,'Authorization':'Bearer '+CFG.supabaseKey},
      body:JSON.stringify({p_per_game:3})
    })
    .then(function(r){return r.json();})
    .then(function(rows){
      var map={}, total=0;
      (rows||[]).forEach(function(r){ (map[r.game_slug]=map[r.game_slug]||[]).push(r); total++; });
      renderScores(map);
    })
    .catch(function(){ renderScores({}); });
  }

  // the theme toggle lives in the same shared bar the games use
  // the hub keeps the collapsible 🕹️ handle; the games use one open row at the bottom
  if (window.Arcade) Arcade.controls({ theme: true, scores: false, hub: false, collapsible: true });

  fetch('./games.json',{cache:'no-cache'})
    .then(function(r){return r.json();})
    .then(function(data){
      games = (data.games||[]).filter(function(g){return g.active !== false;});
      games.forEach(function(g){ grid.appendChild(card(g)); });
      grid.appendChild(soonCard());
      document.getElementById('stat').textContent =
        games.length + (games.length===1 ? ' משחק על הלוח' : ' משחקים על הלוח');
      loadScores();
    })
    .catch(function(){
      grid.innerHTML = '<div class="empty">לא הצלחנו לטעון את רשימת המשחקים.</div>';
    });
})();
</script>
</body>
</html>
