<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>בדיקת טבלת שיאים</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:Rubik,system-ui,sans-serif;background:#0b0d1c;color:#eef1ff;
     min-height:100dvh;display:grid;place-items:center;margin:0;direction:rtl;text-align:center}
.box{width:min(420px,90vw);padding:28px;border-radius:22px;background:rgba(255,255,255,.05);
     border:1px solid rgba(255,255,255,.1)}
h1{font-size:20px;margin:0 0 6px}
p{color:#9aa3c9;font-size:13.5px;margin:0 0 20px}
input,button{font:inherit;width:100%;height:46px;border-radius:13px;margin-bottom:9px;border:0;text-align:center}
input{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:#fff}
button{background:linear-gradient(135deg,#6f8dff,#9b6bff);color:#fff;font-weight:600;cursor:pointer}
button.g{background:rgba(255,255,255,.08)}
</style>
</head>
<body>
<div class="box">
  <h1>🧪 בדיקת טבלת שיאים</h1>
  <p>הזינו ניקוד והריצו את הזרימה של סוף משחק.</p>
  <input id="s" type="number" value="12500" inputmode="numeric">
  <button onclick="Leaderboard.gameOver(+document.getElementById('s').value,{level:4,test:true})">סיום משחק (gameOver)</button>
  <button class="g" onclick="Leaderboard.show()">פתיחת טבלה (show)</button>
</div>
<script src="./config.js"></script>
<script src="./leaderboard.js"></script>
<script>
Leaderboard.init({ game:'area-conquer', title:'סוגר שטחים', scoreLabel:'נקודות' });
</script>
</body>
</html>
